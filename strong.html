<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직업흥미유형 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F8F8;
    --bg-alt: #EDEDED;
    --card: #FFFFFF;
    --text: #222222;
    --text-sub: #313131;
    --text-muted: #6b6b6b;
    --border: #EDEDED;
    --accent: #FA5D29;
    --btn-bg: #222222;
    --btn-bg-hover: #383838;
    --btn-text: #FFFFFF;
    --ease: cubic-bezier(0.25, 1, 0.5, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter Tight', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    background: var(--card);
    border-radius: 16px;
    width: 100%;
    max-width: 720px;
    padding: 56px 52px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    animation: fadeUp 0.6s var(--ease);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    margin-bottom: 16px;
  }

  h1 {
    text-align: center;
    font-family: 'Inter Tight', 'Apple SD Gothic Neo', sans-serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1.2;
    letter-spacing: -0.025em;
    color: var(--text);
  }

  .subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 16px;
    margin-top: 14px;
    margin-bottom: 40px;
  }

  .count-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }

  .count-btn {
    height: 52px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .count-btn:hover {
    border-color: var(--text);
    background: var(--card);
  }

  .count-btn.selected {
    background: var(--text);
    color: var(--btn-text);
    border-color: var(--text);
  }

  .start-btn, .restart-btn {
    width: 100%;
    height: 56px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--btn-text);
    background: var(--btn-bg);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .start-btn:hover:not(:disabled),
  .restart-btn:hover {
    background: var(--btn-bg-hover);
  }

  .start-btn:disabled {
    background: var(--bg-alt);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  .progress-wrap { margin-bottom: 36px; }

  .progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--text-muted);
    font-feature-settings: "tnum" 1;
  }

  .progress-info .progress-percent {
    color: var(--accent);
    font-weight: 600;
  }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s var(--ease);
  }

  .question-prompt {
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-top: 40px;
  }

  .question-text {
    font-size: 22px;
    font-weight: 500;
    line-height: 1.45;
    text-align: center;
    margin: 14px 0 36px;
    min-height: 64px;
    letter-spacing: -0.01em;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .answer-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .answer-btn {
    padding: 18px 22px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    text-align: left;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .answer-btn:hover {
    border-color: var(--text);
    background: var(--bg);
  }

  .answer-mark {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: transparent;
  }

  .answer-btn:hover .answer-mark {
    border-color: var(--text);
  }

  .answer-mark.like { border-color: var(--accent); }
  .answer-mark.like::after { content: "+"; color: var(--accent); font-size: 14px; }
  .answer-mark.neutral::after { content: "·"; color: var(--text-muted); font-size: 18px; line-height: 0; }
  .answer-mark.dislike::after { content: "−"; color: var(--text-muted); font-size: 14px; }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    font-size: 13px;
  }

  .back-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px 0;
    transition: color 0.2s ease;
  }

  .back-btn:hover { color: var(--text); }
  .back-btn:disabled { color: var(--bg-alt); cursor: not-allowed; }

  #result-screen { animation: fadeUp 0.6s var(--ease); }

  .result-type {
    text-align: center;
    font-family: 'Inter Tight', sans-serif;
    font-size: 96px;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1;
    color: var(--text);
    margin-bottom: 12px;
  }

  .result-type .secondary { color: var(--text-muted); }
  .result-type .tertiary { color: var(--bg-alt); }

  .result-name {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin-top: 18px;
    margin-bottom: 6px;
    color: var(--text);
  }

  .result-name .label {
    color: var(--text-muted);
    font-weight: 500;
    margin-right: 10px;
  }

  .result-name .value {
    color: var(--accent);
  }

  .result-name .en {
    display: inline-block;
    margin-left: 10px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.01em;
    vertical-align: middle;
  }

  .result-nick {
    text-align: center;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 36px;
    letter-spacing: -0.005em;
  }

  .result-desc {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-sub);
    margin-bottom: 28px;
    padding: 24px 24px 24px 28px;
    background: var(--bg);
    border-radius: 12px;
    border-left: 3px solid var(--accent);
  }

  .traits {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .trait {
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-sub);
  }

  .trait strong {
    color: var(--accent);
    margin-right: 6px;
    font-weight: 700;
  }

  .section-heading {
    font-family: 'Inter Tight', 'Apple SD Gothic Neo', sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
    margin-top: 36px;
    margin-bottom: 18px;
  }

  .themes {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 8px;
  }

  .theme-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }

  .theme-label {
    width: 22px;
    font-family: 'Inter Tight', sans-serif;
    font-weight: 700;
    color: var(--text);
    font-feature-settings: "tnum" 1;
  }

  .theme-name {
    width: 60px;
    font-size: 13px;
    color: var(--text-sub);
  }

  .theme-bar {
    flex: 1;
    height: 24px;
    background: var(--bg-alt);
    border-radius: 6px;
    overflow: hidden;
  }

  .theme-fill {
    height: 100%;
    background: var(--text);
    transition: width 0.6s var(--ease);
  }

  .theme-row.top .theme-fill { background: var(--accent); }
  .theme-row.top .theme-label { color: var(--accent); }

  .theme-pct {
    width: 44px;
    font-size: 12px;
    font-weight: 600;
    text-align: right;
    color: var(--text-sub);
    font-feature-settings: "tnum" 1;
  }

  .jobs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 36px;
  }

  .job-chip {
    padding: 8px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 13px;
    color: var(--text-sub);
  }

  .cross-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .cross-link:hover { color: var(--accent); }
  .cross-link strong { color: var(--text-sub); font-weight: 600; }

  .hidden { display: none; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    .container { padding: 36px 24px; border-radius: 12px; }
    h1 { font-size: 30px; }
    .subtitle { font-size: 14px; margin-bottom: 28px; }
    .count-grid { grid-template-columns: repeat(2, 1fr); }
    .question-text { font-size: 18px; margin: 12px 0 28px; min-height: 56px; }
    .result-type { font-size: 64px; }
    .result-name { font-size: 22px; margin-top: 14px; }
    .result-name .en { display: block; margin-left: 0; margin-top: 4px; font-size: 13px; }
    .result-nick { font-size: 14px; }
    .traits { grid-template-columns: 1fr; }
    .theme-name { width: 52px; font-size: 12px; }
  }
</style>
</head>

<main class="container">
  <!-- Start Screen -->
  <section id="start-screen">
    <span class="eyebrow">Occupational Interest</span>
    <h1>직업흥미유형 검사</h1>
    <p class="subtitle">Strong 검사의 General Occupational Themes(GOT) 기반</p>
    <div class="count-grid" id="count-grid"></div>
    <button class="start-btn" id="start-btn" disabled>검사 시작하기</button>
    <a class="cross-link" href="index.html">성격유형도 알아볼래요 → <strong>MBTI</strong></a>
  </section>

  <!-- Quiz Screen -->
  <section id="quiz-screen" class="hidden">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progress-text">1 / 30</span>
        <span class="progress-percent" id="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <p class="question-prompt">다음 활동에 대해 어떻게 느끼나요?</p>
    <div class="question-text" id="question-text"></div>
    <div class="answer-list" id="answer-list"></div>
    <div class="nav-row">
      <button class="back-btn" id="back-btn">← 이전 문항</button>
    </div>
  </section>

  <!-- Result Screen -->
  <section id="result-screen" class="hidden">
    <span class="eyebrow">Your Holland Code</span>
    <div class="result-type" id="result-type"></div>
    <div class="result-name" id="result-name"></div>
    <div class="result-nick" id="result-nick"></div>
    <div class="result-desc" id="result-desc"></div>
    <div class="traits" id="result-traits"></div>
    <h2 class="section-heading">6가지 흥미 영역 분포</h2>
    <div class="themes" id="themes"></div>
    <h2 class="section-heading">추천 직업 분야</h2>
    <div class="jobs" id="jobs"></div>
    <button class="restart-btn" id="restart-btn">다시 검사하기</button>
  </section>
</main>

// ============ 6가지 흥미 유형 메타데이터 ============

const THEME_KEYS = ['R', 'I', 'A', 'S', 'E', 'C'];

// ============ 상태 ============
let selectedCount = 0;
let questionList = [];
let currentIdx = 0;
let answers = []; // 각 문항의 응답 점수 (2 / 1 / 0)
let scores = { R:0, I:0, A:0, S:0, E:0, C:0 };

// ============ 시작 화면 ============
const countGrid = document.getElementById('count-grid');
const startBtn = document.getElementById('start-btn');

[18, 30, 60, 90].forEach(n => {
  const btn = document.createElement('button');
  btn.className = 'count-btn';
  btn.textContent = n + '문항';
  btn.addEventListener('click', () => {
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedCount = n;
    startBtn.disabled = false;
  });
  countGrid.appendChild(btn);
});

startBtn.addEventListener('click', startQuiz);

// ============ 퀴즈 진행 ============
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const perTheme = selectedCount / 6;
  const list = [];
  THEME_KEYS.forEach(theme => {
    const picked = shuffle(QUESTIONS[theme]).slice(0, perTheme);
    picked.forEach(q => list.push({ q, theme }));
  });
  questionList = shuffle(list);
  currentIdx = 0;
  answers = [];
  scores = { R:0, I:0, A:0, S:0, E:0, C:0 };

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  renderQuestion();
}

const ANSWER_OPTIONS = [
  { label: "좋아한다", mark: "like",    score: 2 },
  { label: "보통이다", mark: "neutral", score: 1 },
  { label: "관심 없다", mark: "dislike", score: 0 }
];

function renderQuestion() {
  const q = questionList[currentIdx];
  document.getElementById('question-text').textContent = q.q;

  const list = document.getElementById('answer-list');
  list.innerHTML = '';

  ANSWER_OPTIONS.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<span class="answer-mark ${opt.mark}"></span><span>${opt.label}</span>`;
    btn.addEventListener('click', () => answer(opt.score));
    list.appendChild(btn);
  });

  const total = questionList.length;
  const num = currentIdx + 1;
  document.getElementById('progress-text').textContent = `${num} / ${total}`;
  const pct = Math.round((currentIdx / total) * 100);
  document.getElementById('progress-percent').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  document.getElementById('back-btn').disabled = currentIdx === 0;
}

function answer(score) {
  const q = questionList[currentIdx];
  scores[q.theme] += score;
  answers.push({ theme: q.theme, score });
  currentIdx++;
  if (currentIdx >= questionList.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

document.getElementById('back-btn').addEventListener('click', () => {
  if (currentIdx === 0) return;
  const last = answers.pop();
  scores[last.theme] -= last.score;
  currentIdx--;
  renderQuestion();
});

// ============ 결과 화면 ============
function showResult() {
  // 점수 순으로 정렬해 상위 3개 추출 (Holland code)
  const ranked = THEME_KEYS
    .map(k => ({ key: k, score: scores[k] }))
    .sort((a, b) => b.score - a.score);

  const top3 = ranked.slice(0, 3).map(r => r.key);
  const topKey = top3[0];
  const top = THEMES[topKey];

  // 3-letter Holland code 표시 (1순위 강조, 2·3순위는 흐리게)
  document.getElementById('result-type').innerHTML =
    `${top3[0]}<span class="secondary">${top3[1]}</span><span class="tertiary">${top3[2]}</span>`;

  document.getElementById('result-name').innerHTML =
    `<span class="label">유형</span><span class="value">${top.name}</span><span class="en">${top.en}</span>`;
  document.getElementById('result-nick').textContent = top.nick;
  document.getElementById('result-desc').textContent = top.desc;

  // 1순위 테마의 성향 칩
  const traits = document.getElementById('result-traits');
  traits.innerHTML = '';
  top.traits.forEach(t => {
    const div = document.createElement('div');
    div.className = 'trait';
    div.innerHTML = `<strong>✓</strong> ${t}`;
    traits.appendChild(div);
  });

  // 6 테마 막대 차트
  const perTheme = selectedCount / 6;
  const maxScore = perTheme * 2;
  const themesEl = document.getElementById('themes');
  themesEl.innerHTML = '';
  THEME_KEYS.forEach(k => {
    const pct = maxScore === 0 ? 0 : Math.round((scores[k] / maxScore) * 100);
    const isTop = top3.includes(k);
    const row = document.createElement('div');
    row.className = 'theme-row' + (isTop ? ' top' : '');
    row.innerHTML = `
      <div class="theme-label">${k}</div>
      <div class="theme-name">${THEMES[k].name}</div>
      <div class="theme-bar"><div class="theme-fill" style="width:${pct}%"></div></div>
      <div class="theme-pct">${pct}%</div>
    `;
    themesEl.appendChild(row);
  });

  // 상위 3 테마의 직업을 합쳐 추천
  const jobsEl = document.getElementById('jobs');
  jobsEl.innerHTML = '';
  const seen = new Set();
  top3.forEach(k => {
    THEMES[k].jobs.forEach(j => {
      if (seen.has(j)) return;
      seen.add(j);
      const chip = document.createElement('div');
      chip.className = 'job-chip';
      chip.textContent = j;
      jobsEl.appendChild(chip);
    });
  });

  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
}

// ============ 다시 시작 ============
document.getElementById('restart-btn').addEventListener('click', () => {
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
  document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
  startBtn.disabled = true;
  selectedCount = 0;
});
</script>
