<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 성격유형 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F8F8;
    --bg-alt: #EDEDED;
    --card: #FFFFFF;
    --text: #222222;
    --text-sub: #313131;
    --text-muted: #6b6b6b;
    --border: #EDEDED;
    --accent: #FA5D29;
    --btn-bg: #222222;
    --btn-bg-hover: #383838;
    --btn-text: #FFFFFF;
    --ease: cubic-bezier(0.25, 1, 0.5, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter Tight', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    background: var(--card);
    border-radius: 16px;
    width: 100%;
    max-width: 720px;
    padding: 56px 52px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    animation: fadeUp 0.6s var(--ease);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    margin-bottom: 16px;
  }

  h1 {
    text-align: center;
    font-family: 'Inter Tight', 'Apple SD Gothic Neo', sans-serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1.2;
    letter-spacing: -0.025em;
    color: var(--text);
  }

  .subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 16px;
    margin-top: 14px;
    margin-bottom: 40px;
  }

  /* Count selector */
  .count-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }

  .count-btn {
    height: 52px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .count-btn:hover {
    border-color: var(--text);
    background: var(--card);
  }

  .count-btn.selected {
    background: var(--text);
    color: var(--btn-text);
    border-color: var(--text);
  }

  /* Primary button */
  .start-btn, .restart-btn {
    width: 100%;
    height: 56px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--btn-text);
    background: var(--btn-bg);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .start-btn:hover:not(:disabled),
  .restart-btn:hover {
    background: var(--btn-bg-hover);
  }

  .start-btn:disabled {
    background: var(--bg-alt);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  /* Progress */
  .progress-wrap { margin-bottom: 36px; }

  .progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--text-muted);
    font-feature-settings: "tnum" 1;
  }

  .progress-info .progress-percent {
    color: var(--accent);
    font-weight: 600;
  }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s var(--ease);
  }

  /* Question */
  .question-text {
    font-size: 22px;
    font-weight: 500;
    line-height: 1.45;
    text-align: center;
    margin: 48px 0 36px;
    min-height: 72px;
    letter-spacing: -0.01em;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .answer-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .answer-btn {
    padding: 18px 22px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    text-align: left;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .answer-btn:hover {
    border-color: var(--text);
    background: var(--bg);
  }

  /* Result */
  #result-screen { animation: fadeUp 0.6s var(--ease); }

  .result-type {
    text-align: center;
    font-family: 'Inter Tight', sans-serif;
    font-size: 96px;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1;
    color: var(--text);
    margin-bottom: 12px;
  }

  .result-nick {
    text-align: center;
    font-size: 20px;
    font-weight: 500;
    color: var(--text-sub);
    margin-bottom: 36px;
    letter-spacing: -0.01em;
  }

  .character-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 36px;
  }

  /* Sprite: characters.png is 1254x1254 with a ~75px title bar at the top
     and a 4x4 grid below (rows ISTJ/ISFJ/INFJ/INTJ → ESTJ/ESFJ/ENFJ/ENTJ). */
  .character {
    --col: 0;
    --row: 0;
    --scale: 1;
    width: calc(280px * var(--scale));
    height: calc(263px * var(--scale));
    background-image: url('characters.png');
    background-repeat: no-repeat;
    background-size: calc(1120px * var(--scale)) calc(1120px * var(--scale));
    background-position:
      calc(var(--col) * -280px * var(--scale))
      calc((-67px - var(--row) * 263px) * var(--scale));
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  .result-desc {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-sub);
    margin-bottom: 28px;
    padding: 24px 24px 24px 28px;
    background: var(--bg);
    border-radius: 12px;
    border-left: 3px solid var(--accent);
  }

  .traits {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .trait {
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-sub);
  }

  .trait strong {
    color: var(--accent);
    margin-right: 6px;
    font-weight: 700;
  }

  .section-heading {
    font-family: 'Inter Tight', 'Apple SD Gothic Neo', sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
    margin-top: 36px;
    margin-bottom: 18px;
  }

  /* Scores */
  .scores {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 36px;
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
  }

  .score-label {
    width: 24px;
    font-family: 'Inter Tight', sans-serif;
    font-weight: 700;
    color: var(--text);
    font-feature-settings: "tnum" 1;
  }

  .score-bar {
    flex: 1;
    height: 28px;
    background: var(--bg-alt);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
  }

  .score-left, .score-right {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    font-feature-settings: "tnum" 1;
    transition: width 0.5s var(--ease);
  }

  .score-left {
    background: var(--text);
    color: var(--btn-text);
  }

  .score-right {
    background: transparent;
    color: var(--text-muted);
  }

  .cross-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .cross-link:hover { color: var(--accent); }
  .cross-link strong { color: var(--text-sub); font-weight: 600; }

  .hidden { display: none; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    .container { padding: 36px 24px; border-radius: 12px; }
    h1 { font-size: 30px; }
    .subtitle { font-size: 14px; margin-bottom: 28px; }
    .count-grid { grid-template-columns: repeat(2, 1fr); }
    .question-text { font-size: 18px; margin: 32px 0 28px; min-height: 60px; }
    .result-type { font-size: 64px; }
    .result-nick { font-size: 16px; margin-bottom: 28px; }
    .character { --scale: 0.82; }
    .traits { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="container">
  <!-- Start Screen -->
  <section id="start-screen">
    <span class="eyebrow">Personality Test</span>
    <h1>MBTI 성격유형 검사</h1>
    <p class="subtitle">문항 수를 선택하고 검사를 시작해 보세요</p>
    <div class="count-grid" id="count-grid"></div>
    <button class="start-btn" id="start-btn" disabled>검사 시작하기</button>
    <a class="cross-link" href="strong.html">직업흥미유형 검사도 있어요 → <strong>Strong GOT</strong></a>
  </section>

  <!-- Quiz Screen -->
  <section id="quiz-screen" class="hidden">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progress-text">1 / 30</span>
        <span class="progress-percent" id="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="answer-list" id="answer-list"></div>
  </section>

  <!-- Result Screen -->
  <section id="result-screen" class="hidden">
    <span class="eyebrow">Your Type</span>
    <div class="result-type" id="result-type"></div>
    <div class="result-nick" id="result-nick"></div>
    <div class="character-wrap">
      <div class="character" id="character" aria-label="MBTI 유형 캐릭터"></div>
    </div>
    <div class="result-desc" id="result-desc"></div>
    <div class="traits" id="result-traits"></div>
    <h2 class="section-heading">성향 분석</h2>
    <div class="scores" id="scores"></div>
    <button class="restart-btn" id="restart-btn">다시 검사하기</button>
  </section>
</main>

<script>
// ============ 질문 풀 (각 축마다 25개) ============
const QUESTIONS = {
  EI: [
    { q: "처음 만나는 사람들과 어울리는 자리에서 나는", a: "먼저 다가가 대화를 시작한다", b: "누군가 말을 걸어올 때까지 기다린다" },
    { q: "주말에 에너지를 충전하려면", a: "친구들과 함께 시간을 보낸다", b: "혼자만의 시간을 갖는다" },
    { q: "여러 사람과 있을 때 나는", a: "활발해지고 말이 많아진다", b: "조용히 듣는 편이다" },
    { q: "낯선 모임에 갔을 때", a: "쉽게 사람들과 친해진다", b: "익숙해지는 데 시간이 걸린다" },
    { q: "전화 통화는", a: "편하고 즐겁다", b: "되도록 짧게 끝내고 싶다" },
    { q: "내 생각이나 감정은", a: "말로 표현하면서 정리된다", b: "혼자 곰곰이 생각하며 정리된다" },
    { q: "파티에 갔을 때 나는", a: "가능한 많은 사람과 이야기한다", b: "친한 몇 명하고만 깊이 대화한다" },
    { q: "휴식이라 하면", a: "사람들과 함께하는 활동", b: "집에서 혼자 보내는 시간" },
    { q: "새로운 환경에서 나는", a: "빠르게 적응하며 친구를 만든다", b: "조용히 관찰하며 천천히 적응한다" },
    { q: "회의에서 나는", a: "적극적으로 의견을 낸다", b: "충분히 생각한 뒤 말한다" },
    { q: "오랜만의 휴일에 나는", a: "약속을 잡아 사람을 만난다", b: "집에서 쉬며 충전한다" },
    { q: "친구 수에 대해 나는", a: "넓고 다양한 인맥을 선호한다", b: "소수의 깊은 관계를 선호한다" },
    { q: "내 성격은", a: "외향적이고 활동적이다", b: "내향적이고 차분하다" },
    { q: "감정을 처리할 때", a: "사람들과 이야기하며 푼다", b: "혼자 시간을 두고 정리한다" },
    { q: "처음 보는 사람과 단둘이 있을 때", a: "어색해도 대화를 시도한다", b: "조용히 있는 편이 편하다" },
    { q: "활기찬 이벤트는", a: "에너지를 얻게 한다", b: "끝나면 지친다" },
    { q: "직장이나 학교에서 나는", a: "여러 사람과 폭넓게 어울린다", b: "몇몇과 깊게 친해진다" },
    { q: "여행을 갈 때", a: "단체 여행이 즐겁다", b: "혼자 또는 소수와의 여행이 좋다" },
    { q: "고민이 생기면", a: "주변에 털어놓고 조언을 구한다", b: "스스로 충분히 생각한 뒤 결정한다" },
    { q: "처음 보는 사람이 말을 걸면", a: "반갑게 응한다", b: "약간 부담스럽다" },
    { q: "취미는 주로", a: "사람들과 함께하는 활동", b: "혼자 집중할 수 있는 활동" },
    { q: "나의 에너지원은", a: "외부 자극과 사람들의 활기", b: "내면의 사색과 조용한 환경" },
    { q: "회식이나 단체 모임은", a: "기다려진다", b: "부담스러울 때가 있다" },
    { q: "공개 발표는", a: "은근히 즐기는 편이다", b: "되도록 피하고 싶다" },
    { q: "친구가 갑자기 놀러 오겠다고 하면", a: "환영한다", b: "마음의 준비가 필요하다" }
  ],
  SN: [
    { q: "어떤 일을 시작할 때 나는", a: "구체적인 사실과 단계를 본다", b: "전체적인 그림과 가능성을 본다" },
    { q: "설명을 듣거나 글을 읽을 때", a: "사실과 디테일을 잘 기억한다", b: "행간의 의미와 패턴을 잘 캐치한다" },
    { q: "나는", a: "현실적이고 실용적인 편이다", b: "상상력이 풍부하고 이상적이다" },
    { q: "새로운 일을 배울 때", a: "실제로 해보면서 익힌다", b: "원리와 개념을 먼저 이해한다" },
    { q: "이야기를 할 때 나는", a: "있었던 사실 그대로 전한다", b: "은유나 비유를 자주 쓴다" },
    { q: "관심이 가는 주제는", a: "지금 일어나는 현실의 일", b: "미래의 가능성과 아이디어" },
    { q: "문제를 해결할 때", a: "검증된 방법을 따른다", b: "새로운 접근을 시도해 본다" },
    { q: "여행을 계획할 때", a: "구체적 일정과 정보를 정리한다", b: "큰 방향만 잡고 즉흥적으로 움직인다" },
    { q: "좋아하는 책은", a: "실제 사례나 정보가 담긴 책", b: "상상력을 자극하는 소설" },
    { q: "기억에 잘 남는 것은", a: "사람의 외모, 옷차림 등 구체적 정보", b: "그때의 분위기, 인상" },
    { q: "현실보다 더 끌리는 것은", a: "지금 손에 잡히는 것", b: "아직 오지 않은 가능성" },
    { q: "회의에서 나는", a: "수치나 사실을 근거로 말한다", b: "큰 그림과 아이디어로 말한다" },
    { q: "직관과 사실 중 더 신뢰하는 것은", a: "눈에 보이는 사실", b: "직감적 느낌" },
    { q: "새 프로젝트에서 나는", a: "현재 가진 자원으로 시작한다", b: "이상적인 결과를 먼저 그린다" },
    { q: "공상하는 시간이", a: "별로 없다", b: "꽤 많다" },
    { q: "변화에 대해", a: "검증된 후 받아들이는 편이다", b: "새로운 변화에 흥미를 느낀다" },
    { q: "친구가 고민을 말하면", a: "사실관계를 정리해 조언한다", b: "근본 원인과 가능성을 함께 생각한다" },
    { q: "수업이나 강의에서 좋아하는 것은", a: "구체적이고 실용적인 내용", b: "이론적이고 추상적인 내용" },
    { q: "물건을 살 때", a: "스펙과 가성비를 따진다", b: "디자인과 컨셉에 끌린다" },
    { q: "나의 사고방식은", a: "단계적이고 순차적", b: "전체를 한 번에 보는 편" },
    { q: "흥미로운 영화는", a: "실화 기반 이야기", b: "판타지·SF 같은 상상의 세계" },
    { q: "새로운 아이디어가 떠오르면", a: "실현 가능성부터 본다", b: "일단 흥미롭게 발전시킨다" },
    { q: "사물을 바라볼 때", a: "있는 그대로 본다", b: "그 너머의 의미를 본다" },
    { q: "디테일에 대해 나는", a: "꼼꼼히 챙긴다", b: "큰 그림이 더 중요하다" },
    { q: "일상에서 나는", a: "오늘 할 일에 집중한다", b: "미래를 자주 상상한다" }
  ],

// ============ 캐릭터 스프라이트 좌표 ============
// characters.png는 4×4 그리드 (행: I_J / I_P / E_P / E_J, 열: _ST_ / _SF_ / _NF_ / _NT_)
const TYPE_GRID = {
  ISTJ: [0,0], ISFJ: [0,1], INFJ: [0,2], INTJ: [0,3],
  ISTP: [1,0], ISFP: [1,1], INFP: [1,2], INTP: [1,3],
  ESTP: [2,0], ESFP: [2,1], ENFP: [2,2], ENTP: [2,3],
  ESTJ: [3,0], ESFJ: [3,1], ENFJ: [3,2], ENTJ: [3,3]
};

// ============ 상태 ============
let selectedCount = 0;
let questionList = [];
let currentIdx = 0;
let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };

// ============ 시작 화면 ============
const countGrid = document.getElementById('count-grid');
const startBtn = document.getElementById('start-btn');

[30,40,50,60,70,80,90,100].forEach(n => {
  const btn = document.createElement('button');
  btn.className = 'count-btn';
  btn.textContent = n + '문항';
  btn.addEventListener('click', () => {
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedCount = n;
    startBtn.disabled = false;
  });
  countGrid.appendChild(btn);
});

startBtn.addEventListener('click', startQuiz);

// ============ 퀴즈 진행 ============
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const perAxis = selectedCount / 4;
  const list = [];
  ['EI','SN','TF','JP'].forEach(axis => {
    const picked = shuffle(QUESTIONS[axis]).slice(0, perAxis);
    picked.forEach(q => list.push({ ...q, axis }));
  });
  questionList = shuffle(list);
  currentIdx = 0;
  scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = questionList[currentIdx];
  document.getElementById('question-text').textContent = q.q;

  const list = document.getElementById('answer-list');
  list.innerHTML = '';

  [{ text: q.a, side: 'a' }, { text: q.b, side: 'b' }].forEach(({text, side}) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = text;
    btn.addEventListener('click', () => answer(side));
    list.appendChild(btn);
  });

  const total = questionList.length;
  const num = currentIdx + 1;
  document.getElementById('progress-text').textContent = `${num} / ${total}`;
  const pct = Math.round((currentIdx / total) * 100);
  document.getElementById('progress-percent').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

function answer(side) {
  const q = questionList[currentIdx];
  // 'a' answer corresponds to first letter of axis (E, S, T, J), 'b' to second (I, N, F, P)
  const letter = side === 'a' ? q.axis[0] : q.axis[1];
  scores[letter]++;
  currentIdx++;
  if (currentIdx >= questionList.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

// ============ 결과 화면 ============
function showResult() {
  const type =
    (scores.E >= scores.I ? 'E' : 'I') +
    (scores.S >= scores.N ? 'S' : 'N') +
    (scores.T >= scores.F ? 'T' : 'F') +
    (scores.J >= scores.P ? 'J' : 'P');

  const info = TYPES[type];
  document.getElementById('result-type').textContent = type;
  document.getElementById('result-nick').textContent = info.nick;
  document.getElementById('result-desc').textContent = info.desc;

  const [row, col] = TYPE_GRID[type];
  const character = document.getElementById('character');
  character.style.setProperty('--row', row);
  character.style.setProperty('--col', col);

  const traits = document.getElementById('result-traits');
  traits.innerHTML = '';
  info.traits.forEach(t => {
    const div = document.createElement('div');
    div.className = 'trait';
    div.innerHTML = `<strong>✓</strong> ${t}`;
    traits.appendChild(div);
  });

  const pairs = [['E','I'], ['S','N'], ['T','F'], ['J','P']];
  const scoresEl = document.getElementById('scores');
  scoresEl.innerHTML = '';
  pairs.forEach(([l, r]) => {
    const total = scores[l] + scores[r];
    const lPct = total === 0 ? 50 : Math.round((scores[l] / total) * 100);
    const rPct = 100 - lPct;
    const dominant = lPct >= rPct ? l : r;
    const row = document.createElement('div');
    row.className = 'score-row';
    row.innerHTML = `
      <div class="score-label">${dominant}</div>
      <div class="score-bar">
        <div class="score-left" style="width:${lPct}%">${lPct >= 15 ? l + ' ' + lPct + '%' : ''}</div>
        <div class="score-right" style="width:${rPct}%">${rPct >= 15 ? r + ' ' + rPct + '%' : ''}</div>
      </div>
    `;
    scoresEl.appendChild(row);
  });

  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
}

// ============ 다시 시작 ============
document.getElementById('restart-btn').addEventListener('click', () => {
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
  document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
  startBtn.disabled = true;
  selectedCount = 0;
});
</script>
