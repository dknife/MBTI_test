<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>슬리더링크 퍼즐</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    color: #2c3e50;
    -webkit-user-select: none; user-select: none;
  }
  body {
    display: flex; justify-content: center; align-items: center;
    padding: 16px;
  }
  .game {
    background: #fff; border-radius: 20px; padding: 18px 22px 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex; flex-direction: column; align-items: center;
  }
  .hud {
    display: flex; gap: 12px; margin-bottom: 14px; width: 100%; justify-content: center;
  }
  .stat {
    background: #ecf0f1; border-radius: 10px; padding: 6px 14px;
    display: flex; flex-direction: column; align-items: center;
    min-width: 72px;
  }
  .stat .label { font-size: 11px; font-weight: 600; color: #7f8c8d; letter-spacing: 0.5px; }
  .stat .value { font-size: 20px; font-weight: 700; color: #2c3e50; line-height: 1.2; }
  .stat.highlight .value { color: #3498db; }
  .board-wrap { position: relative; display: inline-block; }
  canvas {
    display: block; border-radius: 12px; background: #fafafa;
    cursor: pointer; touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,0.96);
    border-radius: 12px; display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay-card { text-align: center; }
  .overlay-emoji { font-size: 52px; line-height: 1; margin-bottom: 6px; }
  .overlay h2 { margin: 0 0 4px; font-size: 22px; color: #27ae60; }
  .overlay .gain { margin: 0 0 18px; font-size: 16px; font-weight: 700; color: #f39c12; }
  .overlay button {
    padding: 12px 28px; border: none; border-radius: 10px;
    background: #27ae60; color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  .overlay button:hover { background: #219a52; }
  .controls { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .controls button {
    padding: 9px 16px; border: none; border-radius: 8px;
    background: #ecf0f1; color: #2c3e50; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  .controls button:hover { background: #dfe6e9; }
  .controls button.active { background: #3498db; color: #fff; }
  .help {
    margin-top: 12px; font-size: 12px; color: #95a5a6;
    text-align: center; line-height: 1.6; max-width: 420px;
  }
  .help b { color: #7f8c8d; }
</style>
</head>
<body>
<div class="game">
  <div class="hud">
    <div class="stat highlight">
      <span class="label">레벨</span>
      <span class="value" id="levelVal">1</span>
    </div>
    <div class="stat">
      <span class="label">해결</span>
      <span class="value" id="solvedVal">0</span>
    </div>
    <div class="stat">
      <span class="label">점수</span>
      <span class="value" id="scoreVal">0</span>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-card">
        <div class="overlay-emoji">🎉</div>
        <h2>축하합니다!</h2>
        <p class="gain" id="winScore">+0 점</p>
        <button id="nextBtn">다음 레벨 ▶</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="resetBtn">초기화</button>
    <button id="modeBtn">X 표시 모드</button>
  </div>
  <div class="help">
    <b>왼쪽 클릭/드래그</b> 선 긋기 &nbsp;·&nbsp; <b>오른쪽 클릭</b> X 표시<br>
    터치 기기에서는 X 표시 모드로 전환하세요
  </div>
</div>

<script>
(function () {
  'use strict';

  // ===== DOM =====
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const levelVal = document.getElementById('levelVal');
  const solvedVal = document.getElementById('solvedVal');
  const scoreVal = document.getElementById('scoreVal');
  const winScoreEl = document.getElementById('winScore');
  const nextBtn = document.getElementById('nextBtn');
  const resetBtn = document.getElementById('resetBtn');
  const modeBtn = document.getElementById('modeBtn');

  // ===== 상태 =====
  const state = {
    level: 1,
    solvedCount: 0,
    score: 0,
    size: 4,
    puzzle: [],
    h: [], v: [],
    drawing: null,
    solved: false,
    touchX: false,
    PAD: 28, CELL: 60, SIZE: 300,
  };

  // ===== 유틸 =====
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  const sameEdge = (a, b) =>
    a && b && a.type === b.type && a.r === b.r && a.c === b.c;

  // ===== 퍼즐 생성 =====
  function tryGenerateLoop(N) {
    const DOTS = N + 1;
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    const startR = Math.floor(Math.random() * DOTS);
    const startC = Math.floor(Math.random() * DOTS);
    const path = [[startR, startC]];
    const visited = new Set([startR * DOTS + startC]);
    const MAX_LEN = DOTS * DOTS;
    let iter = 0;
    const ITER_LIMIT = 12000;

    function dfs() {
      if (++iter > ITER_LIMIT) return false;
      const [r, c] = path[path.length - 1];
      const len = path.length;

      if (len >= 4) {
        for (const [dr, dc] of dirs) {
          if (r + dr === startR && c + dc === startC) {
            if (len >= MAX_LEN * 0.5 || Math.random() < 0.45) return true;
          }
        }
      }
      const moves = [];
      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= DOTS || nc < 0 || nc >= DOTS) continue;
        if (visited.has(nr * DOTS + nc)) continue;
        if (nr === startR && nc === startC) continue;
        moves.push([nr, nc]);
      }
      shuffle(moves);
      for (const [nr, nc] of moves) {
        visited.add(nr * DOTS + nc);
        path.push([nr, nc]);
        if (dfs()) return true;
        path.pop();
        visited.delete(nr * DOTS + nc);
      }
      return false;
    }

    if (!dfs() || path.length < 4) return null;
    const edges = [];
    for (let i = 0; i < path.length; i++) {
      const [r1, c1] = path[i];
      const [r2, c2] = path[(i + 1) % path.length];
      edges.push({ r1, c1, r2, c2 });
    }
    return edges;
  }

  function tryGeneratePuzzle(N, hintRatio) {
    const minCoverage = Math.max(3, Math.floor(N * N * 0.25));

    for (let retry = 0; retry < 30; retry++) {
      const loop = tryGenerateLoop(N);
      if (!loop || loop.length < 6) continue;

      const numbers = Array.from({ length: N }, () => new Array(N).fill(0));
      for (const e of loop) {
        const { r1, c1, r2, c2 } = e;
        if (r1 === r2) {
          const col = Math.min(c1, c2);
          if (r1 > 0) numbers[r1 - 1][col]++;
          if (r1 < N) numbers[r1][col]++;
        } else {
          const row = Math.min(r1, r2);
          if (c1 > 0) numbers[row][c1 - 1]++;
          if (c1 < N) numbers[row][c1]++;
        }
      }
      let covered = 0;
      for (let r = 0; r < N; r++)
        for (let c = 0; c < N; c++)
          if (numbers[r][c] > 0) covered++;
      if (covered < minCoverage) continue;

      const puzzle = numbers.map(row =>
        row.map(v => (Math.random() < hintRatio ? v : null))
      );
      return { puzzle, solution: loop };
    }
    return null;
  }

  function generatePuzzle(level) {
    const N = Math.min(4 + Math.floor((level - 1) / 3), 7);
    const hintRatio = Math.max(1 - Math.floor((level - 1) / 5) * 0.1, 0.6);

    for (let n = N; n >= 3; n--) {
      for (let attempt = 0; attempt < 3; attempt++) {
        const gen = tryGeneratePuzzle(n, hintRatio);
        if (gen) return { N: n, ...gen };
      }
    }
    return null;
  }

  // ===== 캔버스 =====
  function setupCanvas() {
    const maxW = Math.min(window.innerWidth - 40, 500);
    const maxH = Math.min(window.innerHeight - 320, 500);
    state.SIZE = Math.max(240, Math.min(maxW, maxH));
    state.PAD = Math.max(20, Math.min(state.SIZE * 0.09, 36));
    state.CELL = (state.SIZE - 2 * state.PAD) / state.size;

    const dpr = window.devicePixelRatio || 1;
    canvas.width = state.SIZE * dpr;
    canvas.height = state.SIZE * dpr;
    canvas.style.width = state.SIZE + 'px';
    canvas.style.height = state.SIZE + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const px = c => state.PAD + c * state.CELL;
  const py = r => state.PAD + r * state.CELL;

  // ===== 그리기 =====
  function draw() {
    ctx.clearRect(0, 0, state.SIZE, state.SIZE);
    ctx.fillStyle = '#fafafa';
    ctx.fillRect(0, 0, state.SIZE, state.SIZE);

    const N = state.size;

    // 숫자
    ctx.font = `bold ${Math.max(16, state.CELL * 0.36)}px -apple-system, "Noto Sans KR", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const hint = state.puzzle[r][c];
        if (hint === null) continue;
        const cnt = cellCount(r, c);
        ctx.fillStyle = cnt > hint ? '#e74c3c' : '#34495e';
        ctx.fillText(hint, px(c) + state.CELL / 2, py(r) + state.CELL / 2);
      }
    }

    // 선과 X
    const lineW = Math.max(4, state.CELL * 0.1);
    const xSize = state.CELL * 0.12;
    ctx.lineCap = 'round';
    for (let r = 0; r <= N; r++) {
      for (let c = 0; c < N; c++) {
        if (state.h[r][c] === 1) {
          ctx.strokeStyle = '#3498db';
          ctx.lineWidth = lineW;
          ctx.beginPath();
          ctx.moveTo(px(c), py(r));
          ctx.lineTo(px(c + 1), py(r));
          ctx.stroke();
        } else if (state.h[r][c] === 2) {
          drawX(px(c) + state.CELL / 2, py(r), xSize);
        }
      }
    }
    for (let r = 0; r < N; r++) {
      for (let c = 0; c <= N; c++) {
        if (state.v[r][c] === 1) {
          ctx.strokeStyle = '#3498db';
          ctx.lineWidth = lineW;
          ctx.beginPath();
          ctx.moveTo(px(c), py(r));
          ctx.lineTo(px(c), py(r + 1));
          ctx.stroke();
        } else if (state.v[r][c] === 2) {
          drawX(px(c), py(r) + state.CELL / 2, xSize);
        }
      }
    }

    // 점
    const dotR = Math.max(3.5, state.CELL * 0.065);
    ctx.fillStyle = '#2c3e50';
    for (let r = 0; r <= N; r++) {
      for (let c = 0; c <= N; c++) {
        ctx.beginPath();
        ctx.arc(px(c), py(r), dotR, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawX(cx, cy, s) {
    ctx.strokeStyle = '#bdc3c7';
    ctx.lineWidth = Math.max(2.5, state.CELL * 0.05);
    ctx.beginPath();
    ctx.moveTo(cx - s, cy - s);
    ctx.lineTo(cx + s, cy + s);
    ctx.moveTo(cx + s, cy - s);
    ctx.lineTo(cx - s, cy + s);
    ctx.stroke();
  }

  // ===== 계산 =====
  function cellCount(r, c) {
    let n = 0;
    if (state.h[r][c] === 1) n++;
    if (state.h[r + 1][c] === 1) n++;
    if (state.v[r][c] === 1) n++;
    if (state.v[r][c + 1] === 1) n++;
    return n;
  }

  function dotDegree(r, c) {
    const N = state.size;
    let d = 0;
    if (c > 0 && state.h[r][c - 1] === 1) d++;
    if (c < N && state.h[r][c] === 1) d++;
    if (r > 0 && state.v[r - 1][c] === 1) d++;
    if (r < N && state.v[r][c] === 1) d++;
    return d;
  }

  function checkSolved() {
    const N = state.size;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const hint = state.puzzle[r][c];
        if (hint !== null && cellCount(r, c) !== hint) return false;
      }
    }

    const DOTS = N + 1;
    const active = [];
    for (let r = 0; r <= N; r++) {
      for (let c = 0; c <= N; c++) {
        const d = dotDegree(r, c);
        if (d !== 0 && d !== 2) return false;
        if (d === 2) active.push([r, c]);
      }
    }
    if (active.length === 0) return false;

    const visited = new Set();
    const stack = [active[0]];
    visited.add(active[0][0] * DOTS + active[0][1]);
    while (stack.length) {
      const [r, c] = stack.pop();
      const nbs = [];
      if (c > 0 && state.h[r][c - 1] === 1) nbs.push([r, c - 1]);
      if (c < N && state.h[r][c] === 1) nbs.push([r, c + 1]);
      if (r > 0 && state.v[r - 1][c] === 1) nbs.push([r - 1, c]);
      if (r < N && state.v[r][c] === 1) nbs.push([r + 1, c]);
      for (const [nr, nc] of nbs) {
        const k = nr * DOTS + nc;
        if (!visited.has(k)) { visited.add(k); stack.push([nr, nc]); }
      }
    }
    return visited.size === active.length;
  }

  // ===== 게임 흐름 =====
  function updateHUD() {
    levelVal.textContent = state.level;
    solvedVal.textContent = state.solvedCount;
    scoreVal.textContent = state.score;
  }

  function startLevel() {
    const gen = generatePuzzle(state.level);
    if (!gen) {
      // 안전장치: 생성 실패 시 이전 레벨 유지
      state.level = Math.max(1, state.level - 1);
      return startLevel();
    }
    state.size = gen.N;
    state.puzzle = gen.puzzle;
    state.h = Array.from({ length: gen.N + 1 }, () => new Array(gen.N).fill(0));
    state.v = Array.from({ length: gen.N }, () => new Array(gen.N + 1).fill(0));
    state.solved = false;
    state.drawing = null;

    overlay.classList.remove('show');
    setupCanvas();
    draw();
    updateHUD();
  }

  function onSolved() {
    const gained = 50 + state.level * 10 + state.size * 30;
    state.score += gained;
    state.solvedCount++;
    updateHUD();
    winScoreEl.textContent = '+' + gained + ' 점';
    overlay.classList.add('show');
  }

  function nextLevel() {
    overlay.classList.remove('show');
    state.level++;
    startLevel();
  }

  function resetCurrent() {
    const N = state.size;
    state.h = Array.from({ length: N + 1 }, () => new Array(N).fill(0));
    state.v = Array.from({ length: N }, () => new Array(N + 1).fill(0));
    state.solved = false;
    state.drawing = null;
    overlay.classList.remove('show');
    draw();
  }

  // ===== 입력 =====
  function toLocal(e) {
    const rect = canvas.getBoundingClientRect();
    const scale = state.SIZE / rect.width;
    return {
      mx: (e.clientX - rect.left) * scale,
      my: (e.clientY - rect.top) * scale,
    };
  }

  function segDist(mx, my, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = len2 === 0 ? 0 : ((mx - x1) * dx + (my - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(mx - (x1 + t * dx), my - (y1 + t * dy));
  }

  function getEdgeAt(mx, my) {
    const N = state.size;
    const thresh = state.CELL * 0.4;
    let best = null, bestD = Infinity;
    for (let r = 0; r <= N; r++) {
      for (let c = 0; c < N; c++) {
        const d = segDist(mx, my, px(c), py(r), px(c + 1), py(r));
        if (d < thresh && d < bestD) { bestD = d; best = { type: 'h', r, c }; }
      }
    }
    for (let r = 0; r < N; r++) {
      for (let c = 0; c <= N; c++) {
        const d = segDist(mx, my, px(c), py(r), px(c), py(r + 1));
        if (d < thresh && d < bestD) { bestD = d; best = { type: 'v', r, c }; }
      }
    }
    return best;
  }

  function startDraw(mx, my, target) {
    if (state.solved) return;
    const edge = getEdgeAt(mx, my);
    if (!edge) return;
    const arr = edge.type === 'h' ? state.h[edge.r] : state.v[edge.r];
    const cur = arr[edge.c];
    if (cur === target) {
      arr[edge.c] = 0;
      state.drawing = { target, mode: 'erase', lastEdge: edge };
    } else {
      arr[edge.c] = target;
      state.drawing = { target, mode: 'draw', lastEdge: edge };
    }
    afterMove();
  }

  function continueDraw(mx, my) {
    if (!state.drawing || state.solved) return;
    const edge = getEdgeAt(mx, my);
    if (!edge || sameEdge(edge, state.drawing.lastEdge)) return;
    const arr = edge.type === 'h' ? state.h[edge.r] : state.v[edge.r];
    const newVal = state.drawing.mode === 'draw' ? state.drawing.target : 0;
    if (arr[edge.c] !== newVal) {
      arr[edge.c] = newVal;
      state.drawing.lastEdge = edge;
      afterMove();
    }
  }

  function afterMove() {
    draw();
    if (checkSolved()) {
      state.solved = true;
      setTimeout(onSolved, 400);
    }
  }

  const endDraw = () => { state.drawing = null; };

  // ===== 이벤트 바인딩 =====
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  canvas.addEventListener('mousedown', e => {
    e.preventDefault();
    const { mx, my } = toLocal(e);
    startDraw(mx, my, e.button === 2 ? 2 : 1);
  });
  window.addEventListener('mousemove', e => {
    if (!state.drawing) return;
    const { mx, my } = toLocal(e);
    continueDraw(mx, my);
  });
  window.addEventListener('mouseup', endDraw);

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length !== 1) return;
    const { mx, my } = toLocal(e.touches[0]);
    startDraw(mx, my, state.touchX ? 2 : 1);
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!state.drawing || e.touches.length !== 1) return;
    const { mx, my } = toLocal(e.touches[0]);
    continueDraw(mx, my);
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    endDraw();
  }, { passive: false });

  window.addEventListener('resize', () => {
    setupCanvas();
    draw();
  });

  nextBtn.addEventListener('click', nextLevel);
  resetBtn.addEventListener('click', resetCurrent);
  modeBtn.addEventListener('click', () => {
    state.touchX = !state.touchX;
    modeBtn.classList.toggle('active', state.touchX);
    modeBtn.textContent = state.touchX ? 'X 모드 ON' : 'X 표시 모드';
  });

  // ===== 시작 =====
  updateHUD();
  startLevel();
})();
</script>
</body>
</html>
